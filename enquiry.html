<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the webpage responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- The title displayed on the browser tab -->
    <title>DMS Plumbing - Enquiry</title>
</head>

<body>

    <!-- Header containing the company name and navigation -->
    <header>

        <h1>DMS Plumbing</h1>

        <!-- Main navigation menu -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>

    <main>

        <!-- Enquiry page introduction -->
        <section>

            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below to enquire about a plumbing service.
            </p>

        </section>

        <!-- Plumbing enquiry form -->
        <section>

            <h2>Plumbing Service Enquiry</h2>

            <form action="#" method="post">

                <!-- Customer name -->
                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <!-- Customer phone number -->
                <p>
                    <label for="phone">Phone Number:</label><br>
                    <input type="tel" id="phone" name="phone" required>
                </p>

                <!-- Customer email -->
                <p>
                    <label for="email">Email Address:</label><br>
                    <input type="email" id="email" name="email" required>
                </p>

                <!-- Service selection -->
                <p>
                    <label for="service">Service Required:</label><br>

                    <select id="service" name="service" required>

                        <option value="">
                            Select a service
                        </option>

                        <option value="burst-pipe">
                            Burst Water Pipe Repair
                        </option>

                        <option value="geyser">
                            Geyser Service
                        </option>

                        <option value="leak">
                            Leak Detection
                        </option>

                        <option value="drain">
                            Drain Services
                        </option>

                        <option value="heat-pump">
                            Heat Pump
                        </option>

                        <option value="gas-geyser">
                            Gas Geyser
                        </option>

                        <option value="maintenance">
                            General Plumbing Maintenance
                        </option>

                        <option value="other">
                            Other
                        </option>

                    </select>
                </p>

                <!-- Customer message -->
                <p>
                    <label for="message">
                        Describe Your Plumbing Problem:
                    </label><br>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        cols="40"
                        required
                    ></textarea>
                </p>

                <!-- Form submission button -->
                <p>
                    <button type="submit">
                        Submit Enquiry
                    </button>
                </p>

            </form>

        </section>

    </main>

    <!-- Website footer -->
    <footer>

        <p>&copy; 2026 DMS Plumbing. All Rights Reserved.</p>

    </footer>

</body>

</html>
